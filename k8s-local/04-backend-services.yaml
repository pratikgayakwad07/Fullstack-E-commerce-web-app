# ==========================================
# Auth Service
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-depl
  namespace: purely
  labels:
    app: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth-container
          image: purely/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9030
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: auth-config-map
                  key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
            - name: EUREKA_INSTANCE_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: auth-config-map
                  key: EUREKA_INSTANCE_HOSTNAME
            - name: SPRING_DATA_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: SPRING_DATA_MONGODB_URI_AUTH
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-svc
  namespace: purely
  labels:
    app: auth
spec:
  selector:
    app: auth
  ports:
    - port: 9030
      targetPort: 9030
      protocol: TCP
  type: ClusterIP
---
